name: Core package-plane

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-siblings:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out Core
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Install the digest-locked private .NET SDK
        shell: bash
        run: |
          core_dotnet_script="${RUNNER_TEMP}/chummer-core-dotnet-install.sh"
          core_dotnet_root="${RUNNER_TEMP}/chummer-core-dotnet"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            https://dot.net/v1/dotnet-install.sh --output "${core_dotnet_script}"
          echo "082f7685e156738a1b2e2ed8381a621870d4ce8e8c59278034556f05c186eb2e  ${core_dotnet_script}" \
            | sha256sum --check --strict
          bash "${core_dotnet_script}" \
            --version 10.0.103 \
            --install-dir "${core_dotnet_root}" \
            --no-path
          echo "${core_dotnet_root}" >> "${GITHUB_PATH}"
          echo "DOTNET_ROOT=${core_dotnet_root}" >> "${GITHUB_ENV}"
          "${core_dotnet_root}/dotnet" --info
      - name: Assert the package plane uses exact SDK 10.0.103
        shell: bash
        run: |
          test "$(dotnet --version)" = "10.0.103"
      - name: Verify immutable Core runtime package authority
        run: |
          python3 scripts/ai/runtime-package-plane.py --repo-root .
          python3 -m unittest -v tests/test_runtime_package_plane_authority.py
      - name: Prepare locked owner-contract feed for test restores
        run: |
          bash scripts/ai/bootstrap-contracts-feed.sh
          python3 scripts/ai/bootstrap-owner-contracts-feed.py \
            --repo-root . \
            --feed .tmp/ai/local-nuget \
            --validate-only
      - name: Verify creation-contact package boundary
        run: python3 -m unittest tests/test_creation_contacts_authority.py
      - name: Restore affected Core test graph
        run: >-
          dotnet restore Chummer.Tests/Chummer.Tests.csproj
          -p:TargetFramework=net10.0
      - name: Build and run affected authority tests
        run: >-
          dotnet test Chummer.Tests/Chummer.Tests.csproj
          --configuration Release
          --framework net10.0
          --no-restore
          --disable-build-servers
          -m:1
          --filter
          "FullyQualifiedName~CharacterCreationPrerequisiteServiceTests|FullyQualifiedName~CharacterCreationContactsServiceTests|FullyQualifiedName~FileSystemCharacterSourceDataResolverTests|FullyQualifiedName~CharacterCareerKarmaExpenseEditRulesTests|FullyQualifiedName~CharacterCareerNuyenExpenseEditRulesTests|FullyQualifiedName~CharacterCareerActiveSkillAdvanceRulesTests|FullyQualifiedName~CharacterCareerSkillGroupAdvanceRulesTests|FullyQualifiedName~CharacterCareerKnowledgeSkillAdvanceRulesTests"
      - name: Restore deterministic feature-slice test graph
        run: >-
          dotnet restore Chummer.FeatureSlice.Tests/Chummer.FeatureSlice.Tests.csproj
          -p:TargetFramework=net10.0
      - name: Run Career Calendar authority tests
        run: >-
          dotnet test Chummer.FeatureSlice.Tests/Chummer.FeatureSlice.Tests.csproj
          --configuration Release
          --framework net10.0
          --no-restore
          --disable-build-servers
          -m:1
          --filter
          "FullyQualifiedName~CharacterCareerCalendarRulesTests"
      - name: Verify immutable no-siblings package plane and export bundle
        env:
          CHUMMER_PACKAGE_PLANE_RECEIPT: ${{ runner.temp }}/chummer-core-runtime-package-plane-${{ github.sha }}.receipt.json
          CHUMMER_RUNTIME_PACKAGE_EXPORT_DIR: ${{ runner.temp }}/chummer-core-runtime-package-plane-${{ github.sha }}
        run: bash scripts/ai/verify-no-siblings-package-plane.sh
      - name: Upload exact Core runtime package bundle
        id: upload-runtime-package-bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chummer-core-runtime-package-plane-${{ github.sha }}
          path: ${{ runner.temp }}/chummer-core-runtime-package-plane-${{ github.sha }}
          if-no-files-found: error
          retention-days: 5
          compression-level: 0
          overwrite: false
          include-hidden-files: false
      - name: Verify uploaded runtime package artifact authority
        env:
          RUNTIME_ARTIFACT_ID: ${{ steps.upload-runtime-package-bundle.outputs.artifact-id }}
          RUNTIME_ARTIFACT_DIGEST: ${{ steps.upload-runtime-package-bundle.outputs.artifact-digest }}
        run: |
          [[ "${RUNTIME_ARTIFACT_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${RUNTIME_ARTIFACT_DIGEST}" =~ ^(sha256:)?[0-9a-f]{64}$ ]]
