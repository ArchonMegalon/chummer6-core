name: Core package-plane

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-siblings:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out Core
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Install locked .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: global.json
      - name: Verify immutable no-siblings package plane
        run: bash scripts/ai/verify-no-siblings-package-plane.sh
