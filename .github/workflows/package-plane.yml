name: Core package-plane

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-siblings:
    outputs:
      runtime-artifact-id: ${{ steps.upload-runtime-package-bundle.outputs.artifact-id }}
      runtime-artifact-digest: ${{ steps.upload-runtime-package-bundle.outputs.artifact-digest }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out Core
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Install the digest-locked .NET SDK archive
        shell: bash
        run: |
          core_dotnet_archive="${RUNNER_TEMP}/dotnet-sdk-10.0.103-linux-x64.tar.gz"
          core_dotnet_root="${RUNNER_TEMP}/chummer-core-dotnet-10.0.103-linux-x64"
          test ! -e "${core_dotnet_archive}"
          test ! -e "${core_dotnet_root}"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            https://builds.dotnet.microsoft.com/dotnet/Sdk/10.0.103/dotnet-sdk-10.0.103-linux-x64.tar.gz \
            --output "${core_dotnet_archive}"
          echo "bab94f13c57b2ac821d4924fe66084be9b44c41761ff7ff64522c8f7aba345659d31258401dcec31cc3cf6ccae1d012623075aca1c9b9165bcfe5ba9abda1c0c  ${core_dotnet_archive}" \
            | sha512sum --check --strict
          python3 scripts/ai/runtime-package-plane.py \
            --repo-root . \
            --archive "${core_dotnet_archive}" \
            --destination "${core_dotnet_root}" \
            --extract-sdk-archive
          test -x "${core_dotnet_root}/dotnet"
          echo "${core_dotnet_root}" >> "${GITHUB_PATH}"
          echo "DOTNET_ROOT=${core_dotnet_root}" >> "${GITHUB_ENV}"
          "${core_dotnet_root}/dotnet" --info
      - name: Assert the package plane uses exact SDK 10.0.103
        shell: bash
        run: |
          test "$(dotnet --version)" = "10.0.103"
      - name: Verify immutable Core runtime package authority
        run: |
          python3 scripts/ai/runtime-package-plane.py --repo-root .
          python3 -m unittest -v tests/test_runtime_package_plane_authority.py
          python3 -m unittest -v tests/test_public_runtime_package_handoff.py
      - name: Prepare locked owner-contract feed for test restores
        run: |
          bash scripts/ai/bootstrap-contracts-feed.sh
          python3 scripts/ai/bootstrap-owner-contracts-feed.py \
            --repo-root . \
            --feed .tmp/ai/local-nuget \
            --validate-only
          core_nuget_config="${RUNNER_TEMP}/chummer-core-package-plane.NuGet.Config"
          core_nuget_packages="${RUNNER_TEMP}/chummer-core-package-plane-packages"
          test ! -e "${core_nuget_config}"
          test ! -e "${core_nuget_packages}"
          mkdir --mode=0755 "${core_nuget_packages}"
          cat >"${core_nuget_config}" <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="locked-owner-contracts" value="${GITHUB_WORKSPACE}/.tmp/ai/local-nuget" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" protocolVersion="3" />
            </packageSources>
            <packageSourceMapping>
              <packageSource key="locked-owner-contracts">
                <package pattern="Chummer.*" />
              </packageSource>
              <packageSource key="nuget.org">
                <package pattern="*" />
              </packageSource>
            </packageSourceMapping>
          </configuration>
          EOF
          echo "CHUMMER_CI_NUGET_CONFIG=${core_nuget_config}" >> "${GITHUB_ENV}"
          echo "CHUMMER_CI_NUGET_PACKAGES=${core_nuget_packages}" >> "${GITHUB_ENV}"
          echo "NUGET_PACKAGES=${core_nuget_packages}" >> "${GITHUB_ENV}"
      - name: Verify creation-contact package boundary
        run: python3 -m unittest tests/test_creation_contacts_authority.py
      - name: Restore affected Core test graph from exact sources
        run: |
          dotnet restore Chummer.Tests/Chummer.Tests.csproj \
            --configfile "${CHUMMER_CI_NUGET_CONFIG}" \
            --packages "${CHUMMER_CI_NUGET_PACKAGES}" \
            --force \
            --no-cache \
            -m:1 \
            -p:TargetFramework=net10.0 \
            -p:RestoreAdditionalProjectSources= \
            -p:RestoreFallbackFolders= \
            -p:DisableImplicitNuGetFallbackFolder=true \
            -p:RestoreIgnoreFailedSources=false
          python3 - \
            Chummer.Tests/obj/project.assets.json \
            "${CHUMMER_CI_NUGET_PACKAGES}" \
            "${GITHUB_WORKSPACE}/.tmp/ai/local-nuget" <<'PY'
          import json
          import sys
          from pathlib import Path

          assets_path = Path(sys.argv[1])
          expected_package_root = Path(sys.argv[2]).resolve()
          expected_owner_source = Path(sys.argv[3]).resolve()
          payload = json.loads(assets_path.read_text(encoding="utf-8"))
          folders = list((payload.get("packageFolders") or {}).keys())
          if len(folders) != 1 or Path(folders[0]).resolve() != expected_package_root:
              raise SystemExit(f"ambient package folder in {assets_path}: {folders}")
          expected = {
              "Chummer.Engine.Contracts/0.0.0-local": "project",
              "Chummer.Hub.Registry.Contracts/0.0.0-packageplane.20260721.1": "package",
              "Chummer.Play.Contracts/0.0.0-packageplane.20260721.1": "package",
              "Chummer.Run.Contracts/0.0.0-packageplane.20260721.1": "package",
          }
          libraries = payload.get("libraries") or {}
          observed = {
              identity: details.get("type")
              for identity, details in libraries.items()
              if identity.split("/", 1)[0] in {key.split("/", 1)[0] for key in expected}
          }
          if observed != expected:
              raise SystemExit(f"owner package identities drifted in {assets_path}: {observed}")
          for identity, package_type in observed.items():
              if package_type != "package":
                  continue
              package_id, version = identity.split("/", 1)
              metadata_path = (
                  expected_package_root / package_id.lower() / version / ".nupkg.metadata"
              )
              metadata = json.loads(metadata_path.read_text(encoding="utf-8"))
              if Path(str(metadata.get("source", ""))).resolve() != expected_owner_source:
                  raise SystemExit(
                      f"owner package source drifted in {assets_path}: {identity}"
                  )
          for log in payload.get("logs") or []:
              if log.get("code") == "NU1605" or str(log.get("level", "")).lower() == "error":
                  raise SystemExit(f"restore authority error in {assets_path}: {log}")
          PY
      - name: Build and run affected authority tests
        run: >-
          dotnet test Chummer.Tests/Chummer.Tests.csproj
          --configuration Release
          --framework net10.0
          --no-restore
          --disable-build-servers
          -m:1
          --filter
          "FullyQualifiedName~CharacterCreationPrerequisiteServiceTests|FullyQualifiedName~CharacterCreationContactsServiceTests|FullyQualifiedName~FileSystemCharacterSourceDataResolverTests|FullyQualifiedName~CharacterCareerKarmaExpenseEditRulesTests|FullyQualifiedName~CharacterCareerNuyenExpenseEditRulesTests|FullyQualifiedName~CharacterCareerActiveSkillAdvanceRulesTests|FullyQualifiedName~CharacterCareerSkillGroupAdvanceRulesTests|FullyQualifiedName~CharacterCareerKnowledgeSkillAdvanceRulesTests"
      - name: Restore deterministic feature-slice graph from exact sources
        run: |
          dotnet restore Chummer.FeatureSlice.Tests/Chummer.FeatureSlice.Tests.csproj \
            --configfile "${CHUMMER_CI_NUGET_CONFIG}" \
            --packages "${CHUMMER_CI_NUGET_PACKAGES}" \
            --force \
            --no-cache \
            -m:1 \
            -p:TargetFramework=net10.0 \
            -p:RestoreAdditionalProjectSources= \
            -p:RestoreFallbackFolders= \
            -p:DisableImplicitNuGetFallbackFolder=true \
            -p:RestoreIgnoreFailedSources=false
          python3 - \
            Chummer.FeatureSlice.Tests/obj/project.assets.json \
            "${CHUMMER_CI_NUGET_PACKAGES}" \
            "${GITHUB_WORKSPACE}/.tmp/ai/local-nuget" <<'PY'
          import json
          import sys
          from pathlib import Path

          assets_path = Path(sys.argv[1])
          expected_package_root = Path(sys.argv[2]).resolve()
          expected_owner_source = Path(sys.argv[3]).resolve()
          payload = json.loads(assets_path.read_text(encoding="utf-8"))
          folders = list((payload.get("packageFolders") or {}).keys())
          if len(folders) != 1 or Path(folders[0]).resolve() != expected_package_root:
              raise SystemExit(f"ambient package folder in {assets_path}: {folders}")
          expected = {
              "Chummer.Engine.Contracts/0.0.0-local": "project",
              "Chummer.Hub.Registry.Contracts/0.0.0-packageplane.20260721.1": "package",
              "Chummer.Play.Contracts/0.0.0-packageplane.20260721.1": "package",
              "Chummer.Run.Contracts/0.0.0-packageplane.20260721.1": "package",
          }
          libraries = payload.get("libraries") or {}
          observed = {
              identity: details.get("type")
              for identity, details in libraries.items()
              if identity.split("/", 1)[0] in {key.split("/", 1)[0] for key in expected}
          }
          if observed != expected:
              raise SystemExit(f"owner package identities drifted in {assets_path}: {observed}")
          for identity, package_type in observed.items():
              if package_type != "package":
                  continue
              package_id, version = identity.split("/", 1)
              metadata_path = (
                  expected_package_root / package_id.lower() / version / ".nupkg.metadata"
              )
              metadata = json.loads(metadata_path.read_text(encoding="utf-8"))
              if Path(str(metadata.get("source", ""))).resolve() != expected_owner_source:
                  raise SystemExit(
                      f"owner package source drifted in {assets_path}: {identity}"
                  )
          for log in payload.get("logs") or []:
              if log.get("code") == "NU1605" or str(log.get("level", "")).lower() == "error":
                  raise SystemExit(f"restore authority error in {assets_path}: {log}")
          PY
      - name: Run Career Calendar authority tests
        run: >-
          dotnet test Chummer.FeatureSlice.Tests/Chummer.FeatureSlice.Tests.csproj
          --configuration Release
          --framework net10.0
          --no-restore
          --disable-build-servers
          -m:1
          --filter
          "FullyQualifiedName~CharacterCareerCalendarRulesTests"
      - name: Revalidate locked owner feed after early test graphs
        run: >-
          python3 scripts/ai/bootstrap-owner-contracts-feed.py
          --repo-root .
          --feed .tmp/ai/local-nuget
          --validate-only
      - name: Verify immutable no-siblings package plane and export bundle
        env:
          CHUMMER_PACKAGE_PLANE_RECEIPT: ${{ runner.temp }}/chummer-core-runtime-package-plane-${{ github.sha }}.receipt.json
          CHUMMER_RUNTIME_PACKAGE_EXPORT_DIR: ${{ runner.temp }}/chummer-core-runtime-package-plane-${{ github.sha }}
        run: bash scripts/ai/verify-no-siblings-package-plane.sh
      - name: Upload exact Core runtime package bundle
        id: upload-runtime-package-bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chummer-core-runtime-package-plane-${{ github.sha }}
          path: ${{ runner.temp }}/chummer-core-runtime-package-plane-${{ github.sha }}
          if-no-files-found: error
          retention-days: 5
          compression-level: 0
          overwrite: false
          include-hidden-files: false
      - name: Verify uploaded runtime package artifact authority
        env:
          RUNTIME_ARTIFACT_ID: ${{ steps.upload-runtime-package-bundle.outputs.artifact-id }}
          RUNTIME_ARTIFACT_DIGEST: ${{ steps.upload-runtime-package-bundle.outputs.artifact-digest }}
        run: |
          [[ "${RUNTIME_ARTIFACT_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${RUNTIME_ARTIFACT_DIGEST}" =~ ^(sha256:)?[0-9a-f]{64}$ ]]

  publish-public-runtime-package-handoff:
    name: Publish secret-free Core runtime handoff
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'ArchonMegalon/chummer6-core'
    needs: no-siblings
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PUBLIC_RELEASE_TAG: core-runtime-package-plane-${{ github.sha }}
      PUBLIC_BUNDLE_NAME: chummer-core-runtime-package-plane-${{ github.sha }}.zip
      PUBLIC_RECEIPT_NAME: chummer-core-runtime-package-plane-${{ github.sha }}.public-handoff.json
    steps:
      - name: Check out the exact Core main commit without persisted credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Acquire exact current-run artifact metadata and raw archive by ID
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_ARTIFACT_ID: ${{ needs.no-siblings.outputs.runtime-artifact-id }}
        run: |
          set -euo pipefail
          [[ "${SOURCE_ARTIFACT_ID}" =~ ^[1-9][0-9]*$ ]]
          source_root="${RUNNER_TEMP}/runtime-package-source-${GITHUB_SHA}"
          test ! -e "${source_root}"
          mkdir --mode=0700 "${source_root}"
          api_root="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          artifact_api="${api_root}/actions/artifacts/${SOURCE_ARTIFACT_ID}"
          run_attempt_api="${api_root}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --max-filesize 1048576 \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "${artifact_api}" \
            --output "${source_root}/artifact-metadata.json"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --max-filesize 1048576 \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "${run_attempt_api}" \
            --output "${source_root}/run-attempt-metadata.json"
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 --fail --location \
            --max-redirs 3 --silent --show-error --max-filesize 33554432 \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "${artifact_api}/zip" \
            --output "${source_root}/artifact.zip"
      - name: Prepare commit-derived public assets from authenticated raw bytes
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          head_tree="$(git rev-parse 'HEAD^{tree}')"
          [[ "${head_tree}" =~ ^[0-9a-f]{40}$ ]]
          python3 scripts/ai/public-runtime-package-handoff.py prepare-from-actions-artifact \
            --repo-root "${GITHUB_WORKSPACE}" \
            --artifact-metadata "${RUNNER_TEMP}/runtime-package-source-${GITHUB_SHA}/artifact-metadata.json" \
            --run-metadata "${RUNNER_TEMP}/runtime-package-source-${GITHUB_SHA}/run-attempt-metadata.json" \
            --actions-archive "${RUNNER_TEMP}/runtime-package-source-${GITHUB_SHA}/artifact.zip" \
            --output-dir "${RUNNER_TEMP}/runtime-package-public-${GITHUB_SHA}" \
            --repository "${GITHUB_REPOSITORY}" \
            --commit "${GITHUB_SHA}" \
            --ref "${GITHUB_REF}" \
            --event-name "${GITHUB_EVENT_NAME}" \
            --source-artifact-id "${{ needs.no-siblings.outputs.runtime-artifact-id }}" \
            --source-artifact-digest "${{ needs.no-siblings.outputs.runtime-artifact-digest }}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --workflow-ref "${GITHUB_WORKFLOW_REF}" \
            --workflow-sha "${GITHUB_WORKFLOW_SHA}" \
            --head-tree "${head_tree}"
          test -f "${RUNNER_TEMP}/runtime-package-public-${GITHUB_SHA}/${PUBLIC_BUNDLE_NAME}"
          test -f "${RUNNER_TEMP}/runtime-package-public-${GITHUB_SHA}/${PUBLIC_RECEIPT_NAME}"
      - name: Refuse every pre-existing release or tag, then publish once
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          api_root="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          release_status="$({
            curl --proto '=https' --tlsv1.2 --silent --show-error \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --output "${RUNNER_TEMP}/existing-release.json" \
              --write-out '%{http_code}' \
              "${api_root}/releases/tags/${PUBLIC_RELEASE_TAG}"
          })"
          case "${release_status}" in
            404) ;;
            200) echo "release already exists; overwrite is forbidden" >&2; exit 1 ;;
            *) echo "cannot prove release tag is unused: HTTP ${release_status}" >&2; exit 1 ;;
          esac
          jq --null-input \
            --arg ref "refs/tags/${PUBLIC_RELEASE_TAG}" \
            --arg sha "${GITHUB_SHA}" \
            '{ref: $ref, sha: $sha}' \
            >"${RUNNER_TEMP}/create-tag.json"
          tag_status="$({
            curl --proto '=https' --tlsv1.2 --silent --show-error \
              --request POST \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "Content-Type: application/json" \
              --data-binary "@${RUNNER_TEMP}/create-tag.json" \
              --output "${RUNNER_TEMP}/created-tag.json" \
              --write-out '%{http_code}' \
              "${api_root}/git/refs"
          })"
          case "${tag_status}" in
            201) ;;
            409|422) echo "tag already exists or conflicted; overwrite is forbidden" >&2; exit 1 ;;
            *) echo "cannot atomically create exact Git tag: HTTP ${tag_status}" >&2; exit 1 ;;
          esac
          python3 scripts/ai/public-runtime-package-handoff.py verify-tag-ref \
            --tag-metadata "${RUNNER_TEMP}/created-tag.json" \
            --tag "${PUBLIC_RELEASE_TAG}" \
            --commit "${GITHUB_SHA}"
          gh release create "${PUBLIC_RELEASE_TAG}" \
            "${RUNNER_TEMP}/runtime-package-public-${GITHUB_SHA}/${PUBLIC_BUNDLE_NAME}#Exact Core runtime package plane" \
            "${RUNNER_TEMP}/runtime-package-public-${GITHUB_SHA}/${PUBLIC_RECEIPT_NAME}#Public handoff byte receipt" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Core runtime package plane ${GITHUB_SHA}" \
            --notes "Secret-free, digest-verifiable runtime package handoff for Core commit ${GITHUB_SHA}. Consumers must pin both asset digests in reviewed authority." \
            --verify-tag \
            --latest=false
      - name: Prove the published release is anonymously readable and byte exact
        run: |
          set -euo pipefail
          public_root="https://github.com/${GITHUB_REPOSITORY}/releases/download/${PUBLIC_RELEASE_TAG}"
          public_api="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${PUBLIC_RELEASE_TAG}"
          public_tag_api="https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/tags/${PUBLIC_RELEASE_TAG}"
          mkdir --mode=0755 "${RUNNER_TEMP}/public-runtime-proof-${GITHUB_SHA}"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error --max-filesize 1048576 \
            "${public_api}" \
            --output "${RUNNER_TEMP}/public-runtime-proof-${GITHUB_SHA}/release.json"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error --max-filesize 1048576 \
            "${public_tag_api}" \
            --output "${RUNNER_TEMP}/public-runtime-proof-${GITHUB_SHA}/tag.json"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error --max-filesize 33554432 \
            "${public_root}/${PUBLIC_BUNDLE_NAME}" \
            --output "${RUNNER_TEMP}/public-runtime-proof-${GITHUB_SHA}/${PUBLIC_BUNDLE_NAME}"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error --max-filesize 1048576 \
            "${public_root}/${PUBLIC_RECEIPT_NAME}" \
            --output "${RUNNER_TEMP}/public-runtime-proof-${GITHUB_SHA}/${PUBLIC_RECEIPT_NAME}"
          python3 scripts/ai/public-runtime-package-handoff.py verify-public-release \
            --release-metadata "${RUNNER_TEMP}/public-runtime-proof-${GITHUB_SHA}/release.json" \
            --tag-metadata "${RUNNER_TEMP}/public-runtime-proof-${GITHUB_SHA}/tag.json" \
            --receipt "${RUNNER_TEMP}/runtime-package-public-${GITHUB_SHA}/${PUBLIC_RECEIPT_NAME}" \
            --downloaded-bundle "${RUNNER_TEMP}/public-runtime-proof-${GITHUB_SHA}/${PUBLIC_BUNDLE_NAME}" \
            --downloaded-receipt "${RUNNER_TEMP}/public-runtime-proof-${GITHUB_SHA}/${PUBLIC_RECEIPT_NAME}"
