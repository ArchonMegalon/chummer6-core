# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# You may wish to alter this file to override the set of languages analyzed,
# or to provide custom queries or build logic.
#
# ******** NOTE ********
# We have attempted to detect the languages in your repository. Please check
# the `language` matrix defined below to confirm you have the correct set of
# supported CodeQL languages.
#
name: "CodeQL"

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    # Only run on the following paths / file type changes
    paths:
        - "**.sln"
        - "**.csproj"
        - "**.cs"
        - "**.cshtml"
        - "**.xaml"
        - "**.py"
        - "logs/telemetry/landed/**"
        - ".github/workflows/codeql.yml"
        - "**.yml" # Include this to have the action rerun on yml changes

  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main" ]
    # Only run on the following paths / file type changes
    paths:
        - "**.sln"
        - "**.csproj"
        - "**.cs"
        - "**.cshtml"
        - "**.xaml"
        - "**.py"
        - "logs/telemetry/landed/**"
        - ".github/workflows/codeql.yml"
        - "**.yml" # Include this to have the action rerun on yml changes
  schedule:
    - cron: '20 15 * * 1'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    # Runner size impacts CodeQL analysis time. To learn more, please see:
    #   - https://gh.io/recommended-hardware-resources-for-running-codeql
    #   - https://gh.io/supported-runners-and-hardware-resources
    #   - https://gh.io/using-larger-runners
    # Consider using larger runners for possible analysis time improvements.
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'windows-latest' }}
    timeout-minutes: ${{ (matrix.language == 'swift' && 120) || 360 }}
    permissions:
      actions: read
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: r

    strategy:
      fail-fast: false
      matrix:
        language: [ 'csharp' ]
        # CodeQL supports [ 'cpp', 'csharp', 'go', 'java', 'javascript', 'python', 'ruby', 'swift' ]
        # Use only 'java' to analyze code written in Java, Kotlin or both
        # Use only 'javascript' to analyze code written in JavaScript, TypeScript or both
        # Learn more about CodeQL language support at https://aka.ms/codeql-docs/language-support

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        path: r

    - name: Enable Windows long paths for compatibility checkouts
      if: ${{ runner.os == 'Windows' }}
      shell: powershell
      run: |
        git config --system core.longpaths true

    - name: Checkout run-services compatibility tree
      uses: actions/checkout@v4
      with:
        repository: ArchonMegalon/chummer6-hub
        ref: main
        path: h

    - name: Checkout hub-registry compatibility tree
      uses: actions/checkout@v4
      with:
        repository: ArchonMegalon/chummer6-hub-registry
        ref: fleet/hub-registry
        path: g

    - name: Prepare compatibility tree aliases (Windows)
      if: ${{ runner.os == 'Windows' }}
      shell: powershell
      run: |
        New-Item -ItemType Junction -Path "${env:GITHUB_WORKSPACE}\\chummer.run-services" -Target "${env:GITHUB_WORKSPACE}\\h" | Out-Null
        New-Item -ItemType Junction -Path "${env:GITHUB_WORKSPACE}\\chummer-hub-registry" -Target "${env:GITHUB_WORKSPACE}\\g" | Out-Null

    - name: Prepare compatibility tree aliases (POSIX)
      if: ${{ runner.os != 'Windows' }}
      shell: bash
      run: |
        set -euo pipefail
        ln -sfn "$GITHUB_WORKSPACE/h" "$GITHUB_WORKSPACE/chummer.run-services"
        ln -sfn "$GITHUB_WORKSPACE/g" "$GITHUB_WORKSPACE/chummer-hub-registry"

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        build-mode: manual
        # If you wish to specify custom queries, you can do so here or in a config file.
        # By default, queries listed here will override any specified in a config file.
        # Prefix the list here with "+" to use these queries and those in the config file.

        # For more details on CodeQL's query packs, refer to: https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/configuring-code-scanning#using-queries-in-ql-packs
        # queries: security-extended,security-and-quality


    # Autobuild attempts to build any compiled languages (C/C++, C#, Go, Java, or Swift).
    # If this step fails, then you should remove it and run the build manually (see below)
    # - name: Autobuild
    #   uses: github/codeql-action/autobuild@v3

    # ℹ️ Command-line programs to run using the OS shell.
    # 📚 See https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#jobsjob_idstepsrun

    #   If the Autobuild fails above, remove it and uncomment the following three lines.
    #   modify them (or add more) to build your code if your project, please refer to the EXAMPLE below for guidance.

    - name: Build with compatibility package plane
      shell: bash
      run: |
        set -euo pipefail
        echo "Run, Build Application using script"
        bash scripts/ai/bootstrap-contracts-feed.sh
        dotnet build ../chummer-hub-registry/Chummer.Hub.Registry.Contracts/Chummer.Hub.Registry.Contracts.csproj --configuration Release --nologo -m:1 -p:UseSharedCompilation=false
        dotnet build ../chummer.run-services/Chummer.Run.Contracts/Chummer.Run.Contracts.csproj --configuration Release --nologo -m:1 -p:UseSharedCompilation=false
        dotnet restore ./Chummer.CoreEngine.sln --property:Configuration=Release --property:ChummerEngineContractsPackageVersion=0.0.0-local --disable-parallel
        dotnet build ./Chummer.CoreEngine.sln --configuration Release --no-restore --no-incremental --maxcpucount:1 --property:ChummerEngineContractsPackageVersion=0.0.0-local --property:UseSharedCompilation=false --property:BuildInParallel=false --property:NodeReuse=false

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"
