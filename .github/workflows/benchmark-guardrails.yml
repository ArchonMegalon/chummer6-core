name: Benchmark Guardrails

on:
  push:
    branches:
      - main
      - Docker
    paths:
      - '.github/workflows/benchmark-guardrails.yml'
      - 'Chummer.Application/**'
      - 'Chummer.Benchmarks/**'
      - 'Chummer.Contracts/**'
      - 'Chummer.Infrastructure/**'
      - 'Chummer.Rulesets.Hosting/**'
      - 'Chummer.Rulesets.Sr5/**'
      - 'Chummer.Tests/TestFiles/Bastion.chum5'
      - 'docs/MIGRATION_BACKLOG.md'
  pull_request:
    branches:
      - main
      - Docker
    paths:
      - '.github/workflows/benchmark-guardrails.yml'
      - 'Chummer.Application/**'
      - 'Chummer.Benchmarks/**'
      - 'Chummer.Contracts/**'
      - 'Chummer.Infrastructure/**'
      - 'Chummer.Rulesets.Hosting/**'
      - 'Chummer.Rulesets.Sr5/**'
      - 'Chummer.Tests/TestFiles/Bastion.chum5'
      - 'docs/MIGRATION_BACKLOG.md'

jobs:
  migration-workspace-benchmarks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore benchmark project
        run: dotnet restore Chummer.Benchmarks/Chummer.Benchmarks.csproj

      - name: Check workspace performance budgets
        run: >
          dotnet run --project Chummer.Benchmarks/Chummer.Benchmarks.csproj -c Release --
          --budget-check
          --budget-file Chummer.Benchmarks/workspace-benchmark-budgets.json
          --result-file BenchmarkDotNet.Artifacts/results/migration-workspace-benchmark-results.json

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-workspace-benchmark-results
          path: BenchmarkDotNet.Artifacts/results/migration-workspace-benchmark-results.json
          if-no-files-found: error
          retention-days: 14
