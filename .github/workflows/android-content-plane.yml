name: Core Android content plane

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  android-content-producer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    outputs:
      artifact-id: ${{ steps.upload-android-content.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload-android-content.outputs.artifact-digest }}
    steps:
      - name: Check out the exact Core producer
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the immutable Android content authority
        run: |
          python3 scripts/ai/android-content-plane.py \
            --check \
            --expected-producer-commit "${GITHUB_SHA}"
          python3 -m unittest -v tests/test_android_content_plane.py tests/test_android_content_archive.py

      - name: Export the isolated Android content artifact
        env:
          CONTENT_EXPORT: ${{ runner.temp }}/chummer-core-android-content-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python3 scripts/ai/android-content-plane.py \
            --export \
            --export-dir "${CONTENT_EXPORT}" \
            --expected-producer-commit "${GITHUB_SHA}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}"
          python3 scripts/ai/android-content-plane.py \
            --verify-export \
            --export-dir "${CONTENT_EXPORT}" \
            --expected-producer-commit "${GITHUB_SHA}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}"

      - name: Upload the exact content-only artifact
        id: upload-android-content
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chummer-core-android-content-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/chummer-core-android-content-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: false
          include-hidden-files: false


  android-content:
    needs: android-content-producer
    # Retain the required check even when production fails or is cancelled.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Require successful exact producer
        env:
          PRODUCER_RESULT: ${{ needs.android-content-producer.result }}
        run: test "${PRODUCER_RESULT}" = success

      - name: Check out exact Core producer
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download and verify the exact uploaded archive
        timeout-minutes: 10
        env:
          CONTENT_ARTIFACT_ID: ${{ needs.android-content-producer.outputs.artifact-id }}
          CONTENT_ARTIFACT_DIGEST: ${{ needs.android-content-producer.outputs.artifact-digest }}
          GH_TOKEN: ${{ github.token }}
          CONTENT_REDOWNLOAD: ${{ runner.temp }}/chummer-core-android-content-post-upload-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python3 scripts/ai/android-content-archive.py --export-dir "${CONTENT_REDOWNLOAD}"
