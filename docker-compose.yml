services:
  chummer-core-build:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    working_dir: /work
    volumes:
      - .:/work
      - chummer-core-nuget:/root/.nuget/packages
    environment:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    command:
      - dotnet
      - build
      - Chummer/Chummer.csproj
      - --nologo
      - --tl:off
    profiles: ["build"]

  chummer-core-tests:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    working_dir: /work
    volumes:
      - .:/work
      - chummer-core-nuget:/root/.nuget/packages
    environment:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    command:
      - dotnet
      - test
      - Chummer.Tests/Chummer.Tests.csproj
      - -c
      - Release
      - -f
      - net10.0
      - --tl:off
      - --nologo
    profiles: ["test"]

volumes:
  chummer-core-nuget:
