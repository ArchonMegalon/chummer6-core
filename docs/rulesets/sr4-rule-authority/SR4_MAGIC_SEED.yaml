version: sr4-magic-seed-v1
source_ref: sr4a_core_2009:p176-211
core:
  magic_attribute: used by Awakened characters
  force_attribute: used by spirits, spells, and magical items
  magic_and_resonance_mutually_exclusive: true
  magic_loss_from_essence: for each point or fraction below Essence 6, lose 1 Magic/Resonance
    and reduce maximum by 1
drain:
  resist_pool: Willpower + tradition_drain_attribute
  spellcasting_drain_value: spell listed DV plus adjustments such as net hits where
    applicable
  summoning_binding_drain: twice the hits generated by spirit on opposed test
  damage_type: Stun unless rule indicates Physical
  provider: Sr4MagicProvider
traditions:
  hermetic_drain_attribute: Logic
  shamanic_drain_attribute: Charisma
  all_traditions_use: Willpower + tradition mental attribute
sorcery:
  spellcasting_test: Spellcasting + Magic
  ritual_spellcasting: extended/ritual process with team bonus, time, and seal requirements
  counterspelling_spell_defense: add Counterspelling dice to protected defender pools
  dispelling: Counterspelling + Magic opposed by spell Force + caster Magic; net hits
    reduce original spell hits
  noticing_magic_threshold: 6 - Force, with situational modifiers
conjuring:
  summoning:
    test: Summoning + Magic vs spirit Force
    services: net_hits
    duration: until sunrise or sunset unless bound
    action: Complex
  banishing:
    test: Banishing + Magic vs spirit Force or Force + summoner Magic for bound
    effect: hits reduce owed services
  binding:
    status: extract detailed table/procedure from pages 188-189
adepts:
  power_points: Magic attribute
  source_ref: sr4a_core_2009:p195
table_imports_required:
- spell_list
- spell_drain_values
- spell_type_range_duration
- adept_powers
- spirit_stats
- mentor_spirits
- foci
